name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Build
    uses: spring-io/spring-security-release-tools/.github/workflows/build.yml@3f6cc7ffc137ca160061749d5f34dc30d5f36986 # v1.0.17
    strategy:
      matrix:
        include:
        - nickname: linux adopt 17
          jdk: 17
          jdk-distribution: adopt
        - nickname: linux liberica 17
          jdk: 17
          jdk-distribution: liberica
    with:
      runs-on: ubuntu-latest
      java-version: ${{ matrix.jdk }}
      distribution: ${{ matrix.jdk-distribution }}
    secrets: inherit
  deploy-artifacts:
    name: Deploy Artifacts
    needs: [ build ]
    uses: spring-io/spring-security-release-tools/.github/workflows/deploy-artifacts.yml@3f6cc7ffc137ca160061749d5f34dc30d5f36986 # v1.0.17
    with:
      should-deploy-artifacts: ${{ needs.build.outputs.should-deploy-artifacts }}
    secrets: inherit
  deploy-javadocs:
    name: Deploy Javadocs
    needs: [ build ]
    uses: spring-io/spring-security-release-tools/.github/workflows/deploy-docs.yml@3f6cc7ffc137ca160061749d5f34dc30d5f36986 # v1.0.17
    with:
      should-deploy-docs: ${{ needs.build.outputs.should-deploy-artifacts }}
    secrets: inherit
  antora:
    name: Invoke Antora Docs Build
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ needs.build.outputs.should-deploy-artifacts == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Dispatch (partial build)
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-docs.yml -r docs-build -f build-refname=${{ github.ref_name }}

  perform-release:
    name: Perform Release
    needs: [deploy-artifacts, deploy-javadocs]
    uses: spring-io/spring-security-release-tools/.github/workflows/perform-release.yml@3f6cc7ffc137ca160061749d5f34dc30d5f36986 # v1.0.17
    with:
      should-perform-release: ${{ needs.deploy-artifacts.outputs.artifacts-deployed }}
      project-version: ${{ needs.deploy-artifacts.outputs.project-version }}
      milestone-repo-url: https://repo.spring.io/artifactory/milestone
      release-repo-url: https://repo1.maven.org/maven2
      artifact-path: org/springframework/security/kerberos/spring-security-kerberos-core
      slack-announcing-id: spring-security-kerberos-announcing
    secrets: inherit
